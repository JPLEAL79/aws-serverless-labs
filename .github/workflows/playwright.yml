name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Variables de entorno para AWS SDK
    # NOTA: la región se define explícita para evitar que dotenv la borre en CI
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      # 1 - Clona el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 - Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3 - Instala dependencias
      - name: Install dependencies
        run: npm ci

      # 4 - Instala navegadores Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5 - Ejecuta tests (excluye @local)
      - name: Run Playwright tests
        run: npx playwright test --grep-invert @local --pass-with-no-tests

      # 6 - Sube el reporte HTML
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

