name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1️- Clona el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️- Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3️- Instala dependencias
      - name: Install dependencies
        run: npm ci

      # 4️- Instala navegadores Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5️- Ejecuta tests (excluye @local y NO falla si no hay tests)
      - name: Run Playwright tests
        run: npx playwright test --grep-invert @local --pass-with-no-tests

      # 6️- Sube el reporte (aunque no haya tests)
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
